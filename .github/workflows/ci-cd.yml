name: CI/CD Pipeline - Biblioteca

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # =========================================================================
  # 1. Job de Lint/Qualidade (análise de sintaxe e dependências)
  # =========================================================================
  lint-qualidade:
    name: Lint / Qualidade (Sintaxe e Dependências)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise de sintaxe dos arquivos JavaScript
        run: npm run lint

      - name: Análise da árvore de dependências
        run: npm ls --depth=0

  # =========================================================================
  # 2. Job de Testes automatizados com MySQL real como service container
  # =========================================================================
  testes:
    name: Testes Automatizados (MySQL Service Container)
    runs-on: ubuntu-latest
    needs: [lint-qualidade]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biblioteca
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Popular banco de dados MySQL com schema e dados iniciais
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot biblioteca < db.sql

      - name: Executar testes automatizados
        env:
          PORT: 3000
          JWT_SECRET: ci-jwt-secret-para-testes-unitarios-e-integracao
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: biblioteca
        run: npm test

  # =========================================================================
  # 3. Job de SAST: Análise estática com Trivy e npm audit
  # =========================================================================
  sast:
    name: SAST (Trivy e npm audit)
    runs-on: ubuntu-latest
    needs: [lint-qualidade]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática de vulnerabilidades de dependências (npm audit)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Análise estática de segurança com Trivy (SAST no repositório)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 4. Job de Docker Build da imagem da biblioteca
  # =========================================================================
  docker-build:
    name: Docker Build da Imagem da Biblioteca
    runs-on: ubuntu-latest
    needs: [testes, sast]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker da biblioteca
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: biblioteca:latest

  # =========================================================================
  # 5. Job de DAST: Escaneamento dinâmico com OWASP ZAP contra a aplicação no ar
  # =========================================================================
  dast:
    name: DAST (OWASP ZAP Dynamic Scan)
    runs-on: ubuntu-latest
    needs: [docker-build]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biblioteca
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Popular banco de dados MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot biblioteca < db.sql

      - name: Iniciar aplicação no ar (background)
        env:
          PORT: 3000
          JWT_SECRET: zap-security-dast-jwt-token-secret-key-32b
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: biblioteca
        run: |
          npm start &

      - name: Aguardar aplicação iniciar e responder ao Health Check
        run: |
          echo "Aguardando inicialização da aplicação..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "Aplicação está no ar e respondendo com sucesso em http://localhost:3000!"
              exit 0
            fi
            echo "Aguardando resposta da aplicação... ($i/30)"
            sleep 2
          done
          echo "Erro: Aplicação não iniciou no tempo limite esperado."
          exit 1

      - name: Escaneamento dinâmico OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

