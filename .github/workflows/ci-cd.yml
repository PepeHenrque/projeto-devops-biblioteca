
name: CI/CD Pipeline - Biblioteca

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # =========================================================================
  # 1. Job de Lint/Qualidade
  # =========================================================================
  lint-qualidade:
    name: Lint / Qualidade (Sintaxe e Dependências)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise de sintaxe dos arquivos JavaScript
        run: npm run lint

      - name: Análise da árvore de dependências
        run: npm ls --depth=0

  # =========================================================================
  # 2. Job de Testes Automatizados
  # =========================================================================
  testes:
    name: Testes Automatizados (MySQL Service Container)
    runs-on: ubuntu-latest
    needs: [lint-qualidade]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD}}
          MYSQL_DATABASE: biblioteca
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Popular banco de dados MySQL com schema e dados iniciais
        env:
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD}}
        run: |
          mysql -h ${{ secrets.DB_HOST}} -P ${{ vars.DB_PORT}} -u ${{ secrets.DB_USER}} biblioteca < db.sql

      - name: Executar testes automatizados
        env:
          PORT: 3000
          JWT_SECRET: ${{ secrets.JWT_SECRET}}
          DB_HOST: ${{ secrets.DB_HOST}}
          DB_PORT: ${{ vars.DB_PORT}}
          DB_USER: ${{ secrets.DB_USER}}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD}}
          DB_NAME: biblioteca
        run: npm test

  # =========================================================================
  # 3. Job de SAST
  # =========================================================================
  sast:
    name: SAST (Trivy e npm audit)
    runs-on: ubuntu-latest
    needs: [lint-qualidade]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática de vulnerabilidades de dependências
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Análise estática de segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 4. Job de Docker Build
  # =========================================================================
  docker-build:
    name: Docker Build da Imagem da Biblioteca
    runs-on: ubuntu-latest
    needs: [testes, sast]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker da biblioteca
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: biblioteca:latest

  # =========================================================================
  # 5. Job de Smoke Test
  # =========================================================================
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 5
    env:
      DB_USER: ${{ secrets.DB_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_PORT: ${{ vars.DB_PORT }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir app e banco com docker compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Validar saúde da API
        run: |
          curl --fail --silent --show-error \
            http://localhost:3001/health

      - name: Executar smoke test
        env:
          PORT: 3001
        run: node --test tests/smoke/app.smoke.js

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs

      - name: Derrubar app e banco
        if: always()
        run: docker compose down -v

  # =========================================================================
  # 6. Job de DAST
  # =========================================================================
  dast:
    name: DAST (OWASP ZAP Dynamic Scan)
    runs-on: ubuntu-latest
    needs: [smoke]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD}}
          MYSQL_DATABASE: biblioteca
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Popular banco de dados MySQL
        run: |
          mysql -h ${{ secrets.DB_HOST}} -P ${{ vars.DB_PORT}} -u ${{ secrets.DB_USER}} -p ${{ secrets.MYSQL_PASSWORD}} biblioteca < db.sql

      - name: Iniciar aplicação no ar (background)
        env:
          PORT: 3000
          JWT_SECRET: ${{ secrets.JWT_SECRET}}
          DB_HOST: ${{ secrets.DB_HOST}}
          DB_PORT: ${{ vars.DB_PORT}}
          DB_USER: ${{ secrets.DB_USER}}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD}}
          DB_NAME: biblioteca
        run: |
          npm start &

      - name: Aguardar aplicação iniciar e responder ao Health Check
        run: |
          echo "Aguardando inicialização da aplicação..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "Aplicação está no ar e respondendo com sucesso em http://localhost:3000!"
              exit 0
            fi
            echo "Aguardando resposta da aplicação... ($i/30)"
            sleep 2
          done
          echo "Erro: Aplicação não iniciou no tempo limite esperado."
          exit 1

      - name: Escaneamento dinâmico OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'
