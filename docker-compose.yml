services:
  db:
    image: mysql:8.0
    container_name: biblioteca-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: biblioteca
    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: biblioteca-app
    restart: always

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "3001:3000"

    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: biblioteca

volumes:
  db_data:
